   * Newly confirmed transactions.
   * Data points: Sender/receiver addresses, transaction amounts, gas fees, timestamps, involved smart contracts (if any), token types.
 * Address Reputation/History:
   * Information about known malicious addresses (scams, hacks, ransomware).
   * Transaction history associated with interacting addresses (e.g., links to mixers, darknet markets, sanctioned entities). This might involve graph analysis features.
 * User Interaction Data (Real-time, if applicable):
   * Wallet software interactions (e.g., transaction initiation, signing events, address generation).
   * Exchange API calls or website interactions (e.g., login attempts, withdrawal requests, trade orders).
 * Endpoint Data (Real-time, if monitoring user device):
   * Clipboard monitoring (detecting pasting of known malicious crypto addresses).
   * Network connections (detecting communication with malicious C&C servers or phishing sites).
   * Running processes (detecting known crypto-stealing malware).
   * Browser activity (detecting visits to known phishing domains).
 * Threat Intelligence Feeds (Real-time):
   * Lists of newly identified scam addresses, phishing domains, or malware signatures related to crypto.
   * Alerts about ongoing crypto security campaigns.
